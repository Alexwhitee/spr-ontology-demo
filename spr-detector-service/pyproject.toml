[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spr-detector-service"
version = "0.1.0"
description = "Local SPR anomaly-detection service (MARPP reconstruction) for the SPR ontology demo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "numpy>=1.26",
    "pydantic>=2.5",
]

# 真实 MARPP 推理（M1 增强项）需要以下重依赖；启发式占位阶段不安装。
[project.optional-dependencies]
marpp = [
    "torch>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pywt>=1.6",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools]
# 源码包：spr_anomaly_detection 是拷入的 SPR-Anomaly-Detection 子目录
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
